backend:
  name: github
  repo: happybein1/happybein-astro
  branch: main
  base_url: https://happybein.com
  auth_endpoint: api/auth

publish_mode: simple
media_folder: "public/images/journal"
public_folder: "/images/journal"

collections:
  - name: "journal"
    label: "Journal"
    folder: "src/content/journal"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: [{ label: "Development Update", value: "dev-update" }, { label: "History & Strategy", value: "history-strategy" }], default: "dev-update", hint: "Development Update = build/feature notes on the apps. History & Strategy = reflections on HappyBein itself, its history and direction." }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { label: "Body", name: "body", widget: "markdown" }
      - { label: "Description", name: "description", widget: "text", required: false, hint: "Optional — used as the SEO/social-sharing summary for this article, not shown on the journal listing page." }
